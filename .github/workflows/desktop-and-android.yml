name: desktop-and-android
# 데스크톱(Windows) 앱과 Android APK 빌드(Tauri). 수동 실행(Actions 탭 → Run workflow)하거나 v* 태그를 푸시하면 돌아요.
# 태그로 돌면 결과물을 GitHub Release(시험판)에도 올려서, 로그인 없이 받을 수 있어요.
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Build (NSIS installer + portable exe)
        working-directory: src-tauri
        run: cargo tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: HeavenlyLab-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/heavenly-lab.exe
      - name: Attach to the GitHub Release (tag runs only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/heavenly-lab.exe
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install NDK and platform (the runner already ships the Android SDK)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "ndk;27.0.12077973" "platforms;android-34" "build-tools;34.0.0"
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Build the APK (debug-signed, installable)
        working-directory: src-tauri
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
        run: |
          cargo tauri android init
          cargo tauri android build --apk --debug --target aarch64 --target armv7
      - uses: actions/upload-artifact@v4
        with:
          name: HeavenlyLab-android
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
      - name: Attach to the GitHub Release (tag runs only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          files: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
